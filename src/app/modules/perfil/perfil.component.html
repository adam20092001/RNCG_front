<app-navbar></app-navbar>

<div class="profile-wrapper">
  <h1 class="title">Mi Perfil</h1>

  <div class="profile-card fade-in-up" *ngIf="user">
    <label>Nombres</label>
    <input [(ngModel)]="user.name"   (keypress)="allowOnlyLetters($event)"/>

    <label>Apellidos</label>
    <input [(ngModel)]="user.lastname"   (keypress)="allowOnlyLetters($event)"/>

    <label>Correo</label>
    <input [(ngModel)]="user.mail" disabled />

    <div class="actions">
      <button class="btn btn-primary" (click)="updateProfile()">Guardar Cambios</button>
      <button class="btn btn-secondary" (click)="openResetModal(); $event.preventDefault()">Cambiar contraseña</button>
      <button class="btn btn-danger" (click)="logout()">Cerrar Sesión</button>
    </div>
  </div>
</div>
<!-- MODAL DE RESTABLECIMIENTO -->
        <div class="modal-backdrop" *ngIf="showResetModal">
          <div class="modal-box">
            <h2 class="modal-title">Restablecer Contraseña</h2>
            <div class="modal-field">
              <label>Desea reestablecer la contraseña? <br><br>Se enviara un enlace a su correo</label>
            </div>
            <div class="modal-actions">
              <button class="modal-btn modal-btn-primary" (click)="resetPassword()">Restablecer</button>
              <button class="modal-btn modal-btn-secondary" (click)="closeResetModal()">Cancelar</button>
            </div>
          </div>
        </div>

<app-footer></app-footer>
