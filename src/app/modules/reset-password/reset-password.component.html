<app-navbar-auth></app-navbar-auth>

<div class="page-content">
  <div class="login-container-outer">
    <div class="login-container">
      <!-- Panel izquierdo (igual que login) -->
      <div class="login-left">
        <div class="brand-panel">
          <img src="assets/logo.png" alt="GastroSAI" class="brand-logo" />
          <h2 class="welcome-title">Restablecer Contraseña</h2>
          <p class="welcome-desc">
            Ingresa tu nueva contraseña para recuperar el acceso al sistema.
          </p>
        </div>
      </div>

      <!-- Formulario -->
      <div class="login-right">
        <h2>Restablecer Contraseña</h2>

        <!-- Nueva contraseña -->
        <label for="newPassword">Nueva contraseña</label>
        <div class="password-field">
          <input
            style="color: black;"
            id="newPassword"
            [type]="showNew ? 'text' : 'password'"
            [(ngModel)]="newPassword"
            name="newPassword"
            placeholder="Escribe tu nueva contraseña"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="eye-toggle"
            (mousedown)="$event.preventDefault()"
            (click)="showNew = !showNew"
            [attr.aria-pressed]="showNew"
            title="Mostrar/Ocultar contraseña"
            aria-label="Mostrar/Ocultar contraseña"
          >
            <i class="fa-solid" [ngClass]="showNew ? 'fa-eye' : 'fa-eye-slash'"></i>
          </button>
        </div>
        <div class="field-hint" *ngIf="newPassword && newPassword.length < 6">
          La contraseña debe tener al menos 6 caracteres.
        </div>

        <!-- Confirmar contraseña -->
        <label for="confirmPassword">Confirmar contraseña</label>
        <div class="password-field">
          <input
            style="color: black;"
            id="confirmPassword"
            [type]="showConfirm ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Confirma tu nueva contraseña"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="eye-toggle"
            (mousedown)="$event.preventDefault()"
            (click)="showConfirm = !showConfirm"
            [attr.aria-pressed]="showConfirm"
            title="Mostrar/Ocultar contraseña"
            aria-label="Mostrar/Ocultar contraseña"
          >
            <i class="fa-solid" [ngClass]="showConfirm ? 'fa-eye' : 'fa-eye-slash'"></i>
          </button>
        </div>
        <div class="field-hint" *ngIf="confirmPassword && confirmPassword !== newPassword">
          Las contraseñas no coinciden.
        </div>

        <!-- Botón -->
        <button
          class="login-btn"
          (click)="resetPassword()"
          [disabled]="!newPassword || !confirmPassword || newPassword.length < 6 || confirmPassword !== newPassword"
        >
          Restablecer
        </button>

        <!-- Mensaje de error -->
        <div class="error-banner error-fade" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
