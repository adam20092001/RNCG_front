<app-navbar-auth></app-navbar-auth>
<div class="page-content">
  <div class="login-container-outer">
    <div class="login-container">
      <div class="login-left">
        <div class="brand-panel">
          <img src="assets/logo.png" alt="GastroSAI" class="brand-logo" />
          <h2 class="welcome-title">Restablecer Contraseña</h2>
          <p class="welcome-desc">
            Ingresa tu nueva contraseña para recuperar el acceso al sistema.
          </p>
        </div>
      </div>

      <div class="login-right">
        <h2>Nueva Contraseña</h2>

        <label for="newPassword">Nueva Contraseña</label>
        <input
          type="password"
          [(ngModel)]="newPassword"
          name="newPassword"
          placeholder="Escribe tu nueva contraseña"
        />

        <label for="confirmPassword">Confirmar Contraseña</label>
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Confirma tu nueva contraseña"
        />

        <button class="login-btn" (click)="resetPassword()">Restablecer</button>

        <div class="error-banner error-fade" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
