<nav class="navbar-grid">
  <!-- LOGO -->
  <div class="navbar-logo">
    <a routerLink="/home">
      <img src="assets/logo.png" alt="Logo" />
    </a>
  </div>

  <!-- ENLACES CENTRALES (desktop) / panel oculto (móvil) -->
  <ul class="navbar-links">
    <li><a routerLink="/home" routerLinkActive="active" aria-current="page">Home</a></li>
    <li><a routerLink="/analysis" routerLinkActive="active">Análisis de imagen</a></li>
    <li><a routerLink="/pacientes" routerLinkActive="active">Gestión de pacientes</a></li>
    <li><a routerLink="/resultados" routerLinkActive="active">Visualización de resultados</a></li>
  </ul>

  <!-- ICONOS DERECHA -->
  <div class="navbar-icons">
    <button class="icon-btn bell" aria-label="Notificaciones">
      <i class="fa-solid fa-bell" aria-hidden="true"></i>
      <span class="badge-dot" *ngIf="notificationCount > 0" aria-hidden="true"></span>
    </button>
    <div class="profile-wrapper" #profileWrapper>
      <button type="button"
              class="icon-btn profile"
              [attr.aria-expanded]="isProfileMenuOpen"
              aria-haspopup="menu"
              [attr.aria-controls]="profileMenuId"
              aria-label="Perfil"
              (click)="toggleProfileMenu($event)"
              #profileButton>
        <ng-container *ngIf="userAvatarUrl && userAvatarUrl.length; else profileIcon">
          <img class="avatar" [src]="userAvatarUrl" alt="" />
        </ng-container>
        <ng-template #profileIcon>
          <i class="fa-solid fa-circle-user" aria-hidden="true"></i>
        </ng-template>
      </button>

      <div class="profile-menu" *ngIf="isProfileMenuOpen"
           [id]="profileMenuId"
           role="menu"
           [attr.aria-labelledby]="profileMenuButtonId"
           (keydown)="onMenuKeydown($event)"
           #menuContainer>
        <a class="menu-item" role="menuitem" tabindex="0" routerLink="/perfil" (click)="closeProfileMenu()" #menuItem>Mi Perfil</a>
        <div class="menu-divider" role="separator" aria-hidden="true"></div>
        <button type="button" class="menu-item danger" role="menuitem" tabindex="0" (click)="logout(); closeProfileMenu()" #menuItem>Cerrar Sesión</button>
      </div>
    </div>
  </div>

  <!-- BOTÓN HAMBURGER -->
  <button class="navbar-toggle" (click)="toggleMenu()" aria-label="Abrir menú" [attr.aria-expanded]="isMenuOpen" [attr.aria-controls]="'mobilePanel'">
    <span></span><span></span><span></span>
  </button>
</nav>

<!-- PANEL FULLSCREEN en móvil -->
<div id="mobilePanel" class="mobile-panel" [class.open]="isMenuOpen" role="dialog" aria-modal="true" aria-labelledby="mobileMenuTitle">
  <ul>
    <h2 id="mobileMenuTitle" class="sr-only">Menú de navegación</h2>
    <li><a routerLink="/home" (click)="toggleMenu()">Home</a></li>
    <li><a routerLink="/analysis" (click)="toggleMenu()">Análisis de imagen</a></li>
    <li><a routerLink="/pacientes" (click)="toggleMenu()">Gestión de pacientes</a></li>
    <li><a routerLink="/resultados" (click)="toggleMenu()">Visualización de resultados</a></li>
    <li class="actions">
      <img src="assets/bell-icon.png" alt="Notificaciones" />
      <a routerLink="/perfil" (click)="toggleMenu()"><img src="assets/user-icon.png" alt="Usuario" /></a>
    </li>
  </ul>
</div>
